name: QTL2 regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    env:
      OQS_INSTALL_PATH: ${{ github.workspace }}/.oqs
      PYOQS_VERSION: '0.16.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libssl-dev
      - name: Install pinned dependencies and matching native library
        run: |
          python -m pip install -r requirements.txt
          python -c "import oqs; assert oqs.oqs_version() == '0.16.0'"
          python -m pip check
      - name: Compile and test
        run: |
          python -m compileall -q src tests
          python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Reject accidentally tracked private keys
        run: |
          python - <<'PY'
          import pathlib, subprocess
          for name in subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0'):
              if name:
                  path = pathlib.Path(name.decode())
                  if path.is_file():
                      data = path.read_bytes()
                      assert b'-----BEGIN ' + b'PRIVATE KEY-----' not in data, str(path)
                      assert b'-----BEGIN EC ' + b'PRIVATE KEY-----' not in data, str(path)
                      assert b'-----BEGIN RSA ' + b'PRIVATE KEY-----' not in data, str(path)
          PY
